name: Mise à jour EDT filtré

on:
  schedule:
    - cron: '0 */6 * * *'   # toutes les 6h (heure UTC)
  workflow_dispatch: {}       # bouton "Run workflow" manuel

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer edt_filtre.ics
        env:
          EDT_URL: ${{ secrets.EDT_URL }}
        run: python edt_filtre.py

      - name: Publier si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/edt_filtre.ics
          if git diff --cached --quiet; then
            echo "Aucun changement dans l'EDT."
          else
            git commit -m "Mise à jour automatique de l'EDT"
            git push
          fi
